name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: node --check server.js && node --check public/app.js && node --check public/voice.js
